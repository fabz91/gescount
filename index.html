<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GESCOUNT</title>
<script>/* version web : réglages Supabase dans config.js (à côté de index.html). Programme PC : fournis par le programme. */if(!window.api)document.write('<script src="config.js"><\/script>')</script>
<meta name="gc-version" content="4">
<style>
/* Layout (repris de GESTIME) : bandeau blanc [icône + titre + magasin ⌂] [logo] [⚙], rangée de 4 grands onglets verts, sélecteur de période, puis cartes coiffées d'un bandeau rouge. */
:root{
  --bg:#eef1ed; --surface:#ffffff; --sunk:#f1f4f0; --line:#d6ddd5; --fg:#18231b; --muted:#5d6b60;
  --green:#17613a; --green-2:#23824d; --green-soft:#e2f0e6; --on-green:#ffffff;
  --red:#c4161c; --red-2:#e2342b; --red-soft:#fbe5e3; --on-red:#ffffff;
  --accent:var(--green); --accent-soft:var(--green-soft); --accent-fg:var(--on-green);
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e1; --good:#17613a; --good-soft:#e2f0e6; --info:#2d5a8a; --info-soft:#e2ebf5;
  --bar-empty:#dfe5dd; --n1:#e7a3a0; --hdr:#ffffff; --tab-on:#3cb44b; --teal:#2fa89e; --on-teal:#ffffff; --panel:#ffffff; --logo-bg:transparent; --logo-pad:0; --shadow:0 1px 2px rgba(20,40,25,.08),0 2px 8px rgba(20,40,25,.05);
  --display:system-ui,-apple-system,"Segoe UI",sans-serif; --body:system-ui,-apple-system,"Segoe UI",sans-serif; /* police de Windows, comme GESTIME */
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2a2e32; --surface:#33383c; --sunk:#3b4045; --line:#4a5055; --fg:#eef0f1; --muted:#a8b0b5;
  --green:#36a84a; --green-2:#45c05a; --green-soft:#2c3f31; --on-green:#ffffff;
  --hdr:#1f2326; --tab-on:#3cb44b; --teal:#5fd0c6; --on-teal:#10302d; --panel:#3a3f44;
  --red:#b8191f; --red-2:#d6322a; --red-soft:#3d1d1c; --on-red:#ffffff;
  --warn:#f0b65a; --warn-soft:#3a2e17; --bad:#f08a80; --bad-soft:#3d1f1c; --good:#5cc28d; --good-soft:#1c3325; --info:#8db7e6; --info-soft:#1d2a3a;
  --bar-empty:#2b332d; --n1:#8a4441; --logo-bg:#ffffff; --logo-pad:4px 8px; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a2e32; --surface:#33383c; --sunk:#3b4045; --line:#4a5055; --fg:#eef0f1; --muted:#a8b0b5;
  --green:#36a84a; --green-2:#45c05a; --green-soft:#2c3f31; --on-green:#ffffff;
  --hdr:#1f2326; --tab-on:#3cb44b; --teal:#5fd0c6; --on-teal:#10302d; --panel:#3a3f44;
  --red:#b8191f; --red-2:#d6322a; --red-soft:#3d1d1c; --on-red:#ffffff;
  --warn:#f0b65a; --warn-soft:#3a2e17; --bad:#f08a80; --bad-soft:#3d1f1c; --good:#5cc28d; --good-soft:#1c3325; --info:#8db7e6; --info-soft:#1d2a3a;
  --bar-empty:#2b332d; --n1:#8a4441; --logo-bg:#ffffff; --logo-pad:4px 8px; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.wrap.wide{max-width:none;padding-inline:12px}
.wrap.wide .sub{max-width:none}
.sheet-scroll{max-height:none;min-height:0;overflow:visible} /* v38 : plus de barre de défilement dans la saisie : toute la page défile */

/* ---- bandeau du haut (repris de GESTIME) ---- */
header.top{background:var(--hdr)}
.bar{max-width:1280px;margin:0 auto;padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.ident{display:flex;align-items:center;gap:12px;min-width:0}
.appico{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.appico svg{width:100%;height:100%;display:block}
.apptitle{font-family:var(--display);font-weight:900;font-size:27px;line-height:1;letter-spacing:.02em;color:var(--fg)}
.apptitle b{color:var(--red-2)}
.store{display:flex;align-items:center;gap:8px;margin-top:5px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.house{border:1px solid var(--line);background:var(--surface);color:var(--fg);width:26px;height:26px;display:grid;place-items:center;cursor:pointer;padding:0;border-radius:8px} /* v32 : petite case autour de la maison, comme GESTIME */
.house svg{width:16px;height:16px}
.logo{justify-self:center;display:flex;align-items:center;min-height:46px}
.logo img{max-height:46px;max-width:120px;display:block;background:var(--logo-bg);border-radius:6px;padding:var(--logo-pad)}
.logo .ph{border:1.5px dashed var(--line);color:var(--muted);background:none;border-radius:8px;padding:8px 12px;font:600 12px var(--body);cursor:pointer}
.tools{justify-self:end;display:flex;gap:8px}
.ibtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.ibtn svg{width:17px;height:17px}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn:not(:disabled):hover,.house:hover{color:var(--green-2);border-color:var(--green-2)}
.stripe{height:5px;background:linear-gradient(var(--green) 0 2px,transparent 2px 3px,var(--red-2) 3px 5px)}
.menu{position:absolute;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px;min-width:200px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;color:var(--fg);font:600 14px var(--body);padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--sunk)}
.menu button[aria-current="true"]{background:var(--green-soft);color:var(--green-2)}
nav.tabs{max-width:1280px;margin:0 auto;padding:16px 16px 4px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
nav.tabs button{font:800 13px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 20px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav.tabs button:hover{border-color:var(--tab-on)}
nav.tabs button[aria-selected="true"]{background:var(--tab-on);border-color:var(--tab-on);color:#fff;box-shadow:0 2px 8px rgba(60,180,75,.35)}
.avlate{display:inline-flex;vertical-align:-3px;margin-left:5px}.avlate[hidden]{display:none}.avlate svg.warn{width:17px;height:17px;display:block} /* v45 */
nav.tabs .cnt.blink{animation:updBlink 1s ease-in-out infinite}
nav.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--red-2);color:var(--on-red);font-size:11px;letter-spacing:0}
@media (max-width:640px){
  .bar{grid-template-columns:1fr auto}
  .logo{grid-column:1/-1;grid-row:2;justify-self:center;min-height:0}
  .apptitle{font-size:23px}
  nav.tabs button{padding:8px 12px;font-size:12px}
}

/* ---- période ---- */
.periode{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.periode .nav{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer;font-size:16px}
.periode select,.periode input{height:34px}
.periode input{width:80px}
.periode .sp{flex:1}

/* ---- cartes à bandeau rouge ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel.flush{padding:0;overflow:hidden}
.band{background:linear-gradient(180deg,var(--red-2),var(--red));color:var(--on-red);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}
.panel>.band{margin:-16px -16px 14px;border-radius:var(--r) var(--r) 0 0}
.panel.flush>.band{margin:0}
.band .pillbtn{font:700 12px var(--body);letter-spacing:0;text-transform:none;color:var(--on-red);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:3px 12px;cursor:pointer}
.band .pillbtn:hover{background:rgba(255,255,255,.28)}

h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:75ch}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.kpi.hl .v{color:var(--green)}
.kpi.alert .v{color:var(--red)}
.kpi .d{font-size:12px;color:var(--muted)}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.l,th.l{text-align:left}
tr.tot td{font-weight:800;border-top:2px solid var(--fg);border-bottom:0}
tr.muted td{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap}
.s-a_reclamer{background:var(--warn-soft);color:var(--warn)}
.s-declare{background:var(--warn-soft);color:var(--warn)}
.s-reclame,.s-relance{background:var(--info-soft);color:var(--info)}
.s-accepte,.s-deduit{background:var(--good-soft);color:var(--good)}
.s-refuse{background:var(--bad-soft);color:var(--bad)}
.late{color:var(--bad);font-weight:700}
button.btn,.btn{font:700 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible,.gear:focus-visible,.house:focus-visible,.band .pillbtn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* saisie */
/* grille de saisie : colonnes toutes égales qui se partagent la largeur (elles rétrécissent quand on ajoute un fournisseur) */
.sheet{table-layout:fixed;width:100%}
.sheet td{padding:0;border-right:1px solid var(--line);height:32px;overflow:hidden}
.sheet th{border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;padding:5px 4px;font-size:10.5px}
.sheet th.day,.sheet td.day{width:78px;position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:4px 10px;font-weight:700}
.sheet th.day{z-index:2}
.sheet td.we{color:var(--red)}
.sheet td.hasfac{position:relative}.sheet td.hasfac input{padding-right:20px}
.facdoc{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:13px;height:15px;padding:0;margin:0;border:0;background:none;color:var(--muted,#8a8f98);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.facdoc:hover{color:var(--accent,#e0592a)}.facdoc svg{width:11px;height:13px}
.sheet td input{display:block;width:100%;height:100%;min-width:0;box-sizing:border-box;border:0;border-radius:0;background:transparent;text-align:right;padding:6px 6px;font-variant-numeric:tabular-nums;font-size:13px}
.sheet td input::placeholder{font-size:12px}
/* sélection verte = exactement la case */
.sheet td input:focus,.sheet td input:focus-visible{background:var(--green-soft);outline:2px solid var(--green-2);outline-offset:-2px}
.sheet td.calc{padding:6px 6px;background:var(--sunk);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet tr.tot td{padding:7px 6px;background:var(--sunk);overflow:hidden;text-overflow:ellipsis}
.sheet tr.tot td.day{padding:7px 10px}
.sheet .ca input{font-weight:700}
.fhead{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.fctl{display:flex;justify-content:space-between;align-items:center;gap:3px}
.fmv{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:900 13px/1 var(--body);cursor:pointer;padding:0;display:grid;place-items:center}
.fmv:hover:not(:disabled),.fmv:focus-visible{background:var(--green-2);border-color:var(--green-2);color:#fff}
.fmv:disabled{opacity:.3;cursor:default}
.sheet input.fname{flex:1;min-width:0;width:100%;box-sizing:border-box;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:5px 5px;font:800 10px var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--fg);text-align:left;text-overflow:ellipsis}
.sheet input.fname:focus{border-color:var(--green-2);background:var(--surface);outline:none}
.fx{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--red-2);font:900 11px/1 var(--body);cursor:pointer;padding:0;display:grid;place-items:center}
.fx:hover,.fx:focus-visible{background:var(--red-2);border-color:var(--red-2);color:#fff}
.rn{cursor:text;border-bottom:1px dashed transparent}
.rn:hover{border-bottom-color:currentColor;color:var(--fg)}
.rnin{width:120px;font:700 11px var(--body);text-transform:uppercase;padding:2px 4px}
.colx{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;border:0;background:transparent;color:var(--muted);font:700 13px/17px var(--body);padding:0;cursor:pointer;opacity:.55}
.colx:hover,.colx:focus-visible{opacity:1;background:var(--red-2);color:#fff}
.hidden-cols{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.hidden-cols button{font:600 12px var(--body);border:1px dashed var(--line);background:none;color:var(--fg);border-radius:14px;padding:3px 10px;cursor:pointer}
.hidden-cols button:hover{border-color:var(--green-2);color:var(--green-2)}
.rchip{display:inline-flex;align-items:center;gap:3px}
.hidden-cols button.rdel{border:1px solid var(--line);border-radius:6px;padding:0;width:20px;height:20px;display:grid;place-items:center;color:var(--red-2);font:900 11px/1 var(--body);background:var(--sunk)}
.hidden-cols button.rdel:hover{background:var(--red-2);border-color:var(--red-2);color:#fff}
.sheet td.gtot{background:var(--green-soft);font-weight:700}
/* chart */
svg text{fill:var(--muted);font:11px var(--body)}
svg .vl{fill:var(--fg);font-weight:700}
/* bars list */
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 90px;gap:4px 8px;align-items:center;font-size:13px}
.hb .tr{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--green)}
.hb .n{text-align:right;font-variant-numeric:tabular-nums}
.hb span.hsub{font-size:12px;color:var(--muted)} .hb span.hname{padding-left:14px}
.hb .tr.hsub{height:6px} .hb .tr.hsub i{opacity:.55}
/* avoirs */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;font:700 13px var(--body);color:var(--fg);cursor:pointer;display:flex;gap:6px;align-items:baseline}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--on-green)}
.chip[aria-pressed="true"] .c{color:var(--on-green)}
.chip .c{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.form .wide{grid-column:1/-1}
.hist{font-size:12px;color:var(--muted)}
.empty-state{padding:32px 16px;text-align:center;color:var(--muted)}
.note{background:var(--red-soft);color:var(--fg);border-radius:var(--r);padding:10px 12px;font-size:13px;border:1px solid var(--line)}
.foot{font-size:12px;color:var(--muted);padding:8px 14px}
/* réglages (repris de GESTIME) */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.18)}
.reglages{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,calc((100vw - 1280px)/2 + 16px));width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:16px 18px 18px;z-index:41}
.reglages .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.reglages .head h3{margin:0;flex:1;font-family:var(--display);font-weight:800;font-size:24px;color:var(--fg);text-shadow:0 0 10px rgba(69,192,90,.45)}
.reglages .cloud{color:var(--green-2);display:grid;place-items:center}
.reglages .cloud svg{width:24px;height:24px}
.reglages .x{border:0;background:none;color:var(--fg);font-size:26px;line-height:1;cursor:pointer;padding:2px 4px}
.reglages h4{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);margin:16px 0 8px;opacity:.85}
.rbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font:700 16px var(--display);color:var(--fg);cursor:pointer;text-align:left}
.rbtn:hover{border-color:var(--green-2)}
.rbtn .ic{font-size:18px;width:22px;text-align:center}
.ibtn.upd{position:relative}.ibtn.upd::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--red-2);border:2px solid var(--hdr)}
.rver{font-size:13px;font-weight:700;color:var(--muted);margin:-2px 0 4px 2px}
.rtheme{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rtheme button{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:700 16px var(--display);cursor:pointer}
.rtheme button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.rinfo{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin:-2px 0 10px;line-height:1.5}
.reglages .row input,.reglages .row select{background:var(--surface)}
.storelist{display:grid;gap:6px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-weight:700;font-size:13px;z-index:60}
.gap{height:16px}
@media (prefers-reduced-motion:no-preference){.hb .tr i{transition:width .3s}}

/* ===== Uniformisation avec GESTIME (v17) : mêmes couleurs, même mode sombre, même bandeau, mêmes onglets, mêmes réglages ===== */
:root{--bg:#f6f5f1;--sunk:#f6f5f1;--line:#e2e0d8;--fg:#1d2433;--muted:#6b7385;
  --green:#237a3b;--green-2:#237a3b;--green-soft:#e2f0e4;--good:#237a3b;--good-soft:#e2f0e4;--red:#d3262b;--red-2:#d3262b;
  --tab-on:#237a3b;--teal:#237a3b;--on-teal:#fff;--hdr:#ffffff;--panel:#ffffff;--logo-bg:#fff;--logo-pad:4px 8px}

<script>
(function(){
"use strict";
/* =====================================================================

   Même base que GESMAR : bandeau, réglages, synchronisation Supabase, mise à jour GitHub.
   Différences voulues (données sensibles) :
   - connexion obligatoire (compte Supabase, e-mail + mot de passe) ; table « gescount » réservée aux comptes connectés ;
   - verrouillage automatique après quelques minutes sans activité (des employés utilisent le PC) ;
   - données du PC chiffrées (AES-GCM, clé tirée du mot de passe) : illisibles sans le mot de passe.
   ===================================================================== */
const APP="GESCOUNT",APP_VERSION=4,TABLE="gescount",LSP="gescount.";
const MOIS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MC=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

const CONTRATS=["CDI","CDD","Apprentissage","Contrat pro","Étudiant","Intérim","Autre"];
const POLES0=[["march","Marchandises"],["sal","Salaires"],["soc","Charges sociales"],["loyer","Loyer et charges"],["energ","Énergie"],["impot","Impôts et taxes"],["banque","Frais bancaires"],["assur","Assurances"],["entret","Entretien et réparations"],["tel","Téléphone et informatique"],["transp","Transport"],["emprunt","Emprunts"],["recet","Recettes"],["virint","Virements internes"],["autre","Autres"]];
const REGLES0=[["URSSAF","soc"],["MALAKOFF","soc"],["AG2R","soc"],["KLESIA","soc"],["HUMANIS","soc"],["AUDIENS","soc"],["PREVOYANCE","soc"],["MUTUELLE","soc"],["DGFIP","impot"],["IMPOT","impot"],["TRESOR PUBLIC","impot"],["CFE","impot"],["EDF","energ"],["ENGIE","energ"],["TOTALENERGIES","energ"],["TOTAL ENERGIES","energ"],["ORANGE","tel"],["SFR","tel"],["BOUYGUES","tel"],["FREE","tel"],["AXA","assur"],["ALLIANZ","assur"],["MMA","assur"],["GENERALI","assur"],["MAAF","assur"],["FRAIS","banque"],["COMMISSION","banque"],["COTIS","banque"],["AGIOS","banque"],["INTERETS","banque"],["DIAPAR","march"],["CARREFOUR","march"],["REMISE CB","recet"],["REMISE CARTE","recet"],["REMISE CARTES","recet"],["VERSEMENT ESPECES","recet"],["ECHEANCE PRET","emprunt"],["ECH PRET","emprunt"],["REMBOURSEMENT PRET","emprunt"],["SALAIRE","sal"],["PAIE","sal"]];

const S={store:"bredis",tab:"bord",year:new Date().getFullYear(),month:new Date().getMonth(),modal:false,modalPanel:null,
  empFilt:"actifs",editEmp:null,ficheEmp:null,editBul:null,bulImport:null,relImport:null,opFilt:"tout",opPole:"",opText:"",showRegles:false,editConge:null,locked:true};
try{S.tab=localStorage.getItem(LSP+"tab")||"bord";if(!["bord","emp","sal","banque","ana"].includes(S.tab))S.tab="bord";S.store=localStorage.getItem(LSP+"store")||"bredis";if(!MAGS.some(m=>m.id===S.store))S.store="bredis"}catch(e){}

/* ---------- outils ---------- */
const $=s=>document.querySelector(s);
const eur=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur2=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2});
const n2=new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const e0=v=>v==null||!isFinite(v)?"—":eur.format(Math.abs(v)<0.5?0:v), e2=v=>v==null||!isFinite(v)?"—":eur2.format(Math.abs(v)<0.005?0:v), f2=v=>v==null||v===""||!isFinite(v)?"":n2.format(v);
const pct=v=>v==null||!isFinite(v)?"—":(v*100).toFixed(1).replace(".",",")+" %";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseNum=s=>{s=String(s??"").trim().replace(/[\s  ]/g,"").replace(/€/g,"").replace(",",".");if(s==="")return null;const v=Number(s);return isFinite(v)?Math.round(v*100)/100:NaN};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const frDate=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"—";
const frD=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7):"—";
const mk=(y,m)=>y+"-"+String(m+1).padStart(2,"0");
const kAdd=(k,n)=>{let y=+k.slice(0,4),m=+k.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return mk(y,m)};
const kLbl=k=>MOIS[+k.slice(5,7)-1]+" "+k.slice(0,4), kShort=k=>MC[+k.slice(5,7)-1]+" "+k.slice(2,4);
const curK=()=>mk(S.year,S.month);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
const nk=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
const daysBetween=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const sum=(a,f)=>a.reduce((s,x)=>s+((f?f(x):x)||0),0);
const evo=(a,b)=>a==null||b==null||!b?null:a/b-1;
function evoHtml(v,upBad){if(v==null||!isFinite(v))return '<span class="muted">—</span>';const up=v>0.0005,dn=v<-0.0005;const cls=up?(upBad?"neg":"posi"):dn?(upBad?"posi":"neg"):"muted";return `<span class="${cls}">${up?"▲ +":dn?"▼ −":""}${Math.abs(v*100).toFixed(1).replace(".",",")} %</span>`}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function askConfirm(msg,ok){return new Promise(res=>{const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:grid;place-items:center;padding:16px";
  o.innerHTML=`<div style="background:var(--surface,#fff);color:var(--fg,#18231b);border-radius:12px;max-width:520px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)"><div style="white-space:pre-wrap;font-size:14px;line-height:1.5">${esc(msg)}</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn" data-r="0">Annuler</button><button class="btn ${ok?"red":"primary"}" data-r="1">${esc(ok||"Continuer")}</button></div></div>`;
  o.addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(b||e.target===o){o.remove();res(!!(b&&b.dataset.r==="1"))}});document.body.appendChild(o);o.querySelector('[data-r="1"]').focus()})}

/* ---------- chiffrement des données du PC ---------- */
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(email,pw){const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:te.encode("GESCOUNT|"+email),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encTxt(key,txt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,te.encode(txt));return JSON.stringify({gescount:"chiffre",iv:b64(iv),ct:b64(ct)})}
async function decTxt(key,j){const o=JSON.parse(j);if(!o||o.gescount!=="chiffre")throw new Error("format");return td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct)))}

function newD(){return{employes:{},bulletins:{},ops:{},releves:{},conges:{},ca:{},
  poles:Object.fromEntries(POLES0.map(([id,nom],i)=>[id,{nom,ordre:i}])),regles:Object.fromEntries(REGLES0.map(([m,p],i)=>["r"+i,{motif:m,pole:p}]))}}
function norm(d){const n=newD(),o=d&&typeof d==="object"?d:{};for(const k of Object.keys(n))if(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))n[k]=o[k];return n}
const STORE={};MAGS.forEach(m=>STORE[m.id]=newD());
const META={};const meta=id=>META[id]||(META[id]={rev:0,dirty:false,base:null,cnt:0});

const SAVEQ={};
function saveBlob(id){if(!AUTH.key)return Promise.resolve();const me=meta(id),key=AUTH.key;
  const txt=JSON.stringify({app:APP,magasin:id,rev:me.rev,dirty:me.dirty,base:me.base,doc:STORE[id]});
  return SAVEQ[id]=(SAVEQ[id]||Promise.resolve()).then(async()=>rawSave("gescount-"+id,await encTxt(key,txt))).catch(e=>{console.error(e);toast("Enregistrement sur ce poste impossible")})}
async function loadLocal(){
  for(const m of MAGS){const raw=rawLoad("gescount-"+m.id);let b=null;
    if(raw){try{b=JSON.parse(await decTxt(AUTH.key,raw))}catch(e){try{rawSave("gescount-"+m.id+"-illisible",raw)}catch(_){}}}
    STORE[m.id]=norm(b&&b.doc);const me=meta(m.id);me.rev=b?b.rev||0:0;me.dirty=!!(b&&b.dirty);me.base=b&&b.base?b.base:null}}

/* ---------- modifications + annuler / rétablir ---------- */
const HIST={undo:[],redo:[],lastT:0};
function change(fn,id){id=id||S.store;const me=meta(id),before=clone(STORE[id]);
  const now=Date.now();if(!(now-HIST.lastT<800&&HIST.undo.length&&HIST.undo[HIST.undo.length-1].id===id))HIST.undo.push({id,before});HIST.lastT=now;if(HIST.undo.length>30)HIST.undo.shift();HIST.redo=[];
  if(!me.dirty&&!me.base)me.base=before;fn(STORE[id]);me.dirty=true;me.cnt++;saveBlob(id);SYNC.schedule(id);schedule()}
function histStep(from,to,msg){const g=from.pop();if(!g)return;const me=meta(g.id);to.push({id:g.id,before:clone(STORE[g.id])});
  if(!me.dirty&&!me.base)me.base=clone(STORE[g.id]);STORE[g.id]=norm(g.before);me.dirty=true;me.cnt++;saveBlob(g.id);SYNC.schedule(g.id);if(g.id!==S.store){S.store=g.id}toast(msg);render()}
const undo=()=>histStep(HIST.undo,HIST.redo,"Modification annulée"), redo=()=>histStep(HIST.redo,HIST.undo,"Modification rétablie");
function updHist(){const u=$("#undoBtn"),r=$("#redoBtn");if(u)u.disabled=!HIST.undo.length;if(r)r.disabled=!HIST.redo.length}

/* ================= connexion (compte Supabase) ================= */
const AUTH={email:"",pw:"",key:null,token:null,refresh:null,t:null};
function cfg(){let c=window.SYNC&&window.SYNC.url&&window.SYNC.key?{url:window.SYNC.url,key:window.SYNC.key}:null;
  if(c&&/VOTRE/.test(c.url+"|"+c.key))c=null;return c?{url:String(c.url).trim().replace(/\/+$/,""),key:String(c.key).trim()}:null}
async function authReq(grant,body){const c=cfg();
  const r=await fetch(c.url+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:c.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||("Erreur "+r.status));e.status=r.status;throw e}return j}
function setSession(j){AUTH.token=j.access_token;AUTH.refresh=j.refresh_token;clearTimeout(AUTH.t);AUTH.t=setTimeout(refreshSession,Math.max(30,(j.expires_in||3600)-120)*1000)}
async function refreshSession(){clearTimeout(AUTH.t);if(!AUTH.email)return false;
  try{setSession(await authReq("refresh_token",{refresh_token:AUTH.refresh}));return true}
  catch(e){try{setSession(await authReq("password",{email:AUTH.email,password:AUTH.pw}));return true}catch(_){AUTH.token=null;AUTH.t=setTimeout(refreshSession,60000);return false}}}
function authFile(){try{return JSON.parse(rawLoad("gescount-compte")||"null")}catch(e){return null}}
async function login(email,pw){
  email=String(email||"").trim().toLowerCase();if(!email||!pw)throw new Error("Tapez l'adresse e-mail et le mot de passe.");
  const c=cfg(),saved=authFile();let online=null,err=null;
  const key=await deriveKey(email,pw);
  if(c){try{online=await authReq("password",{email,password:pw})}catch(e){err=e}}
  if(!online){
    if(err&&err.status&&err.status<500)throw new Error(err.status===400||err.status===401?"Adresse e-mail ou mot de passe incorrect.":err.status===429?"Trop d'essais : attendez une minute.":"Connexion refusée : "+err.message);
    if(!c&&!saved)throw new Error("Réglages Supabase absents : le fichier config.js doit être rempli (voir LISEZ-MOI).");
    if(!saved||saved.email!==email)throw new Error("Pas d'accès au serveur. La première connexion sur ce poste doit se faire avec internet.");
    try{await decTxt(key,saved.check)}catch(e){throw new Error("Mot de passe incorrect.")}
  }
  const first=!AUTH.key;AUTH.email=email;AUTH.pw=pw;AUTH.key=key;
  if(online){setSession(online);rawSave("gescount-compte",JSON.stringify({email,check:await encTxt(key,"GESCOUNT-OK")}))}
  if(first){await loadLocal();SYNC.start();setTimeout(()=>autoDossiers(),3000)}
  else if(!AUTH.token)refreshSession().then(ok=>{if(ok)SYNC.start()});
}
async function unlock(email,pw){email=String(email||"").trim().toLowerCase();
  if(AUTH.key&&email!==AUTH.email)throw new Error("Ce poste est ouvert avec "+AUTH.email+". Pour changer de compte : Réglages → Se déconnecter.");
  const saved=authFile(),key=await deriveKey(email,pw);
  if(saved&&saved.email===email){try{await decTxt(key,saved.check)}catch(e){throw new Error("Mot de passe incorrect.")}AUTH.pw=pw;return}
  return login(email,pw)}

/* ================= synchronisation Supabase (table « gescount ») ================= */
function gmMerge(base,mine,theirs,res){const J=JSON.stringify,eq=(a,b)=>J(a)===J(b),obj=o=>o&&typeof o==="object"&&!Array.isArray(o),prim=v=>v===undefined||v===null||typeof v!=="object",cp=v=>v===undefined?undefined:JSON.parse(J(v));
  if(eq(mine,base))return cp(theirs);if(eq(theirs,base))return cp(mine);if(eq(mine,theirs))return cp(mine);
  if(obj(mine)&&obj(theirs)){const b=obj(base)?base:{},o={};for(const k of new Set([...Object.keys(b),...Object.keys(mine),...Object.keys(theirs)])){const v=gmMerge(b[k],mine[k],theirs[k],res);if(v!==undefined)o[k]=v}return o}
  if(Array.isArray(mine)&&Array.isArray(theirs)){const idd=a=>a.every(x=>obj(x)&&x.id!=null);
    if(idd(mine)&&idd(theirs)){const B=new Map((Array.isArray(base)&&idd(base)?base:[]).map(x=>[x.id,x])),M=new Map(mine.map(x=>[x.id,x])),T=new Map(theirs.map(x=>[x.id,x])),out=[];
      for(const i of [...mine.map(x=>x.id),...theirs.map(x=>x.id).filter(i=>!M.has(i))]){const v=gmMerge(B.get(i),M.get(i),T.get(i),res);if(v!==undefined)out.push(v)}return out}
    return cp(mine)}
  if(prim(mine)&&prim(theirs)){res.n++;return typeof mine==="string"||typeof theirs==="string"?"":undefined}
  return cp(mine)}
const EFF_MSG="⚠️ Une case a été tapée en même temps sur un autre poste : elle a été effacée, réécrivez-la.";
function gmNotice(msg){let n=document.getElementById("gtn");if(!n){n=document.createElement("div");n.id="gtn";n.setAttribute("role","alert");document.body.appendChild(n);n.addEventListener("click",()=>n.remove())}
  n.textContent=msg+"  ✕";clearTimeout(gmNotice.t);gmNotice.t=setTimeout(()=>{const x=document.getElementById("gtn");if(x)x.remove()},10000)}
const SYNC=(()=>{
  const st={state:"off",msg:"Synchronisation non réglée",busy:false,timer:null,pend:new Set(),poll:null,started:false};
  const ERR=/Erreur|Accès|Table|connect/;
  function set(state,msg){const ch=st.state!==state||st.msg!==msg;st.state=state;st.msg=msg;if(ch&&S.modal)renderModal()}
  async function req(path,opt,again){const c=cfg();if(!AUTH.token)throw new Error("Hors ligne : pas encore connecté au serveur");
    const r=await fetch(c.url+"/rest/v1/"+path,Object.assign({},opt,{headers:Object.assign({apikey:c.key,Authorization:"Bearer "+AUTH.token,"Content-Type":"application/json"},opt&&opt.headers)}));
    if(r.status===401&&!again){if(await refreshSession())return req(path,opt,true)}
    if(!r.ok){let t="";try{t=(await r.json()).message||""}catch(e){}
      throw new Error(r.status===401||r.status===403?"Accès refusé par la base (reconnectez-vous, ou vérifiez le script SQL)":r.status===404||/does not exist|schema cache/.test(t)?"Table « gescount » absente : lancez le script SQL dans Supabase":"Erreur "+r.status+(t?" : "+t:""))}
    return r.status===204||r.status===201?null:r.json()}
  const pull=async id=>{const a=await req(TABLE+"?id=eq."+encodeURIComponent(id)+"&select=data,rev");return a&&a[0]||null};
  function adopt(id,row){const me=meta(id),theirs=norm(row.data&&row.data.doc),res={n:0};
    if(me.dirty)STORE[id]=norm(me.base?gmMerge(me.base,STORE[id],theirs,res):gmMerge(theirs,STORE[id],theirs,res));else STORE[id]=theirs;
    me.base=me.dirty?clone(theirs):null;me.rev=row.rev;
    if(res.n){me.eff=Date.now();me.effSeen=me.eff;gmNotice(EFF_MSG)}
    else{const e=row.data&&row.data.eff;if(e&&e>(me.effSeen||0)){if(me.seenOnce)gmNotice(EFF_MSG);me.effSeen=e}}
    me.seenOnce=true;saveBlob(id);schedule()}
  async function push(id){const me=meta(id);
    for(let essai=0;essai<4;essai++){
      const cnt=me.cnt,doc=clone(STORE[id]),body={data:{app:APP,magasin:id,doc,eff:me.eff||undefined},rev:me.rev+1,updated_at:new Date().toISOString()};
      const a=await req(TABLE+"?id=eq."+encodeURIComponent(id)+"&rev=eq."+me.rev,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify(body)});
      if(a&&a.length){me.rev=a[0].rev;if(me.cnt===cnt){me.dirty=false;me.base=null}else me.base=doc;saveBlob(id);return}
      const r=await pull(id);
      if(!r){await req(TABLE,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id,data:{app:APP,magasin:id,doc:newD()},rev:0})});me.rev=0;continue}
      adopt(id,r)}
    throw new Error("Erreur : trop de modifications en même temps, nouvel essai bientôt")}
  async function flush(){if(st.busy||!cfg()||!st.started)return;st.busy=true;const ids=[...st.pend];st.pend.clear();set("wait","Envoi…");
    try{for(const id of ids)await push(id);set("ok","Synchronisé avec les autres postes")}
    catch(e){ids.forEach(i=>st.pend.add(i));set("ko",ERR.test(e.message)?e.message:"Hors ligne : modifications gardées sur ce poste");setTimeout(flush,5000)}
    finally{st.busy=false;if(st.pend.size&&st.state!=="ko")setTimeout(flush,800)}}
  function schedule(id){if(!cfg()||!st.started)return;st.pend.add(id);clearTimeout(st.timer);st.timer=setTimeout(flush,800)}
  async function first(){
    for(const m of MAGS){const id=m.id,me=meta(id),r=await pull(id);
      if(r&&r.data&&r.data.eff)me.effSeen=Math.max(me.effSeen||0,r.data.eff);
      if(!r){me.dirty=true;st.pend.add(id);continue}
      if(!r.data||!r.data.doc){me.rev=r.rev;me.dirty=true;st.pend.add(id);continue}
      if(r.rev>me.rev||(!me.dirty&&r.rev!==me.rev))adopt(id,r);else if(r.rev<me.rev){me.rev=r.rev;me.dirty=true}
      if(me.dirty)st.pend.add(id);me.seenOnce=true}}
  async function poll(){if(!cfg()||!st.started||st.busy||st.pend.size)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&!S.locked)return;
    try{const all=await req(TABLE+"?select=id,rev");let ch=false;
      for(const x of all||[]){if(!MAGS.some(m=>m.id===x.id))continue;const me=meta(x.id);if(x.rev>me.rev){const r=await pull(x.id);if(r){adopt(x.id,r);ch=true;if(me.dirty)st.pend.add(x.id)}}}
      if(st.pend.size)flush();else set("ok",ch?"Mis à jour depuis un autre poste":"Synchronisé avec les autres postes")}
    catch(e){set("ko",ERR.test(e.message)?e.message:"Hors ligne")}}
  let visHook=false;
  async function start(){if(st.started)return;if(!cfg()){set("off","Synchronisation non réglée (config.js)");return}
    if(!AUTH.token){set("ko","Hors ligne : modifications gardées sur ce poste");setTimeout(async()=>{if(await refreshSession())start()},30000);return}
    st.started=true;set("wait","Synchronisation…");
    try{await first();if(st.pend.size)await flush();else set("ok","Synchronisé avec les autres postes")}
    catch(e){st.started=false;set("ko",ERR.test(e.message)?e.message:"Hors ligne : modifications gardées sur ce poste");setTimeout(start,15000);return}
    clearInterval(st.poll);st.poll=setInterval(poll,15000);
    if(!visHook){visHook=true;document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()})}}
  function markAll(){MAGS.forEach(m=>{const me=meta(m.id);me.dirty=true;me.cnt++;saveBlob(m.id);schedule(m.id)})}
  return{st,start,schedule,markAll,poll};
})();

const empNom=e=>e?((e.nom||"").toUpperCase()+(e.prenom?" "+e.prenom:"")).trim()||"(sans nom)":"(salarié supprimé)";
const emps=d=>Object.entries((d||D()).employes).map(([id,e])=>({id,...e}));
const empActif=e=>e.actif!==false&&!(e.sortie&&e.sortie<todayISO());
const bulsOf=(d,k)=>Object.entries(d.bulletins).filter(([,b])=>!k||b.mois===k).map(([id,b])=>({id,...b}));
const cout=b=>b.cout!=null&&b.cout!==""?+b.cout:(b.brut||0)+(b.chargesPat||0);
function masse(d,k){const L=bulsOf(d,k);return{n:L.length,cout:sum(L,cout),brut:sum(L,b=>b.brut||0),net:sum(L,b=>b.net||0),pat:sum(L,b=>b.chargesPat||0),sal:sum(L,b=>b.chargesSal||0),primes:sum(L,b=>b.primes||0),hsup:sum(L,b=>b.hsup||0)}}
function anc(e){if(!e.entree)return"—";const m=Math.max(0,(new Date().getFullYear()-+e.entree.slice(0,4))*12+(new Date().getMonth()+1-+e.entree.slice(5,7)));return m<12?m+" mois":Math.floor(m/12)+" an"+(m>=24?"s":"")+(m%12?" "+(m%12)+" m":"")}
function lastBul(d,empId,before){return bulsOf(d).filter(b=>b.emp===empId&&(!before||b.mois<=before)).sort((a,b)=>a.mois<b.mois?1:-1)[0]||null}
function cpInfo(d,e){const b=bulsOf(d).filter(x=>x.emp===e.id&&x.cpSolde!=null&&x.cpSolde!=="").sort((a,b)=>a.mois<b.mois?1:-1)[0];
  const man=e.cpSolde!=null&&e.cpSolde!==""?{solde:+e.cpSolde,au:e.cpAu||"",src:"saisi"}:null;
  const fromB=b?{solde:+b.cpSolde,acquis:b.cpAcquis,pris:b.cpPris,au:kAdd(b.mois,1)+"-01",src:"bulletin "+kShort(b.mois)}:null;
  const r=!fromB?man:!man?fromB:(man.au>fromB.au?man:fromB);if(!r)return null;
  const poses=Object.values(d.conges).filter(c=>c.emp===e.id&&c.debut>=(r.au||"")).reduce((s,c)=>s+(+c.jours||0),0);
  return{...r,poses,reste:r.solde-poses}}
function joursOuvrables(a,b){if(!a||!b||b<a)return 0;let n=0;for(let t=Date.parse(a);t<=Date.parse(b);t+=864e5){if(new Date(t).getUTCDay()!==0)n++}return n}

const STOP=new Set("PRLV SEPA VIR VIREMENT CB CARTE FACTURE FACT PAIEMENT PAI DU DE LE LA LES DES ET REF ECH MDT RUM ICS INST INSTANTANE EMIS RECU WEB PAR POUR AU A SA SAS SARL EURL SNC FR N NO NUM ORDRE BENEF DONNEUR MOTIF ID ACHAT PRELEVEMENT EUROPEEN RECURRENT PERMANENT TIP CHQ CHEQUE EN FAVEUR ECHEANCE DATE".split(" "));
function tiers(lib){const w=nk(lib).split(" ").filter(Boolean),k=w.filter(x=>!STOP.has(x)&&!/\d/.test(x)&&x.length>1);return(k.length?k:w.filter(x=>!/\d/.test(x))).slice(0,2).join(" ")||w.slice(0,2).join(" ")}
function classer(d,lib){const L=" "+nk(lib)+" ";let best=null;for(const r of Object.values(d.regles)){const m=nk(r.motif);if(m&&L.includes(" "+m)&&d.poles[r.pole]&&(!best||m.length>nk(best.motif).length))best=r}return best?best.pole:""}
const opsAll=d=>Object.entries(d.ops).map(([id,o])=>({id,...o})).filter(o=>o.date);
const opsMois=(d,k)=>opsAll(d).filter(o=>o.date.slice(0,7)===k);
const poleNom=(d,p)=>p&&d.poles[p]?d.poles[p].nom:"Non classé";
const polesTri=d=>Object.entries(d.poles).map(([id,p])=>({id,...p})).sort((a,b)=>(a.ordre??99)-(b.ordre??99));
const isInterne=o=>o.pole==="virint";
function moisCouverts(d){const s=new Set();for(const r of Object.values(d.releves)){if(!r.debut||!r.fin)continue;let k=r.debut.slice(0,7);while(k<=r.fin.slice(0,7)){s.add(k);k=kAdd(k,1)}}opsAll(d).forEach(o=>s.add(o.date.slice(0,7)));return s}
function tiersIdx(d){const T={};for(const o of opsAll(d)){const t=o.tiers||tiers(o.lib);const x=T[t]||(T[t]={t,first:o.date,mois:{},ops:[]});if(o.date<x.first)x.first=o.date;x.mois[o.date.slice(0,7)]=(x.mois[o.date.slice(0,7)]||0)+o.montant;x.ops.push(o)}return T}
function soldeFin(d,k){const r=Object.values(d.releves).filter(r=>r.fin&&r.fin.slice(0,7)<=k&&r.soldeFin!=null).sort((a,b)=>a.fin<b.fin?1:-1)[0];return r?{v:r.soldeFin,au:r.fin}:null}
function salaireAuto(d){ // opérations de virement de salaire reconnues : montant = net d'un bulletin du mois ou du mois d'avant
  const m={},B=bulsOf(d);for(const o of opsAll(d)){if(o.montant>=0||o.pointe)continue;const k=o.date.slice(0,7),L=nk(o.lib);
    const c=B.filter(b=>(b.mois===k||b.mois===kAdd(k,-1))&&b.net&&Math.abs(Math.abs(o.montant)-b.net)<0.01);
    const best=c.find(b=>{const e=d.employes[b.emp];return e&&e.nom&&L.includes(nk(e.nom))})||(c.length===1?c[0]:null);
    if(best)m[o.id]=best}return m}
function abonnements(d,k){const T=tiersIdx(d),out=[];const mm=[kAdd(k,-3),kAdd(k,-2),kAdd(k,-1),k];
  for(const x of Object.values(T)){const deb=x.ops.filter(o=>o.montant<0&&!isInterne(o));const per=mm.map(m=>deb.filter(o=>o.date.slice(0,7)===m));
    if(per.filter(a=>a.length).length<3||per.some(a=>a.length>2))continue;
    const seq=deb.filter(o=>o.date.slice(0,7)<=k).sort((a,b)=>a.date<b.date?-1:1);if(seq.length<3)continue;
    const last=seq[seq.length-1],prev=seq[seq.length-2],a=Math.abs(last.montant),p=Math.abs(prev.montant);
    out.push({t:x.t,pole:last.pole,dernier:a,avant:p,hausse:a>p*1.02&&a-p>1?a/p-1:null,jour:+last.date.slice(8,10),date:last.date,moy:sum(seq.slice(-3),o=>Math.abs(o.montant))/Math.min(3,seq.length)})}
  return out.sort((a,b)=>b.dernier-a.dernier)}
function nouvelles(d,k){const T=tiersIdx(d),avant=opsAll(d).some(o=>o.date.slice(0,7)<k);if(!avant)return[];
  return Object.values(T).filter(x=>x.first.slice(0,7)===k).flatMap(x=>x.ops.filter(o=>o.montant<0&&o.date.slice(0,7)===k&&!isInterne(o)).map(o=>({...o,t:x.t}))).sort((a,b)=>a.montant-b.montant)}
function disparues(d,k){const T=tiersIdx(d),cov=moisCouverts(d);if(!cov.has(k))return[];
  return Object.values(T).filter(x=>[1,2,3].every(i=>(x.mois[kAdd(k,-i)]||0)<0)&&!x.mois[k]).map(x=>({t:x.t,moy:Math.abs(([1,2,3].reduce((s,i)=>s+x.mois[kAdd(k,-i)],0))/3),pole:x.ops[x.ops.length-1].pole}))}
function doublons(d,k){const L=opsMois(d,k).filter(o=>o.montant<0).sort((a,b)=>a.date<b.date?-1:1),out=[];
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];if(daysBetween(a.date,b.date)>3)break;
    if(Math.abs(a.montant-b.montant)<0.005&&(a.tiers||tiers(a.lib))===(b.tiers||tiers(b.lib))&&Math.abs(a.montant)>=5)out.push([a,b])}return out}
function parPole(d,k){const r={};for(const o of opsMois(d,k)){const p=o.pole||"";r[p]=(r[p]||0)+o.montant}return r}
function alertes(){const d=D(),t=todayISO(),k=curK(),out=[];
  for(const e of emps(d).filter(empActif)){
    if(e.finContrat){const j=daysBetween(t,e.finContrat);if(j<=30)out.push({tab:"emp",niv:j<0?"r":"o",txt:`${empNom(e)} : fin de ${e.contrat||"contrat"} ${j<0?"dépassée depuis le":"le"} ${frDate(e.finContrat)}${j>=0?" (dans "+j+" j)":""}`})}
    if(e.finEssai){const j=daysBetween(t,e.finEssai);if(j>=0&&j<=15)out.push({tab:"emp",niv:"o",txt:`${empNom(e)} : fin de la période d'essai le ${frDate(e.finEssai)} (dans ${j} j)`})}
    if(e.visite){const j=daysBetween(t,e.visite);if(j<=30)out.push({tab:"emp",niv:j<0?"r":"o",txt:`${empNom(e)} : visite médicale ${j<0?"à refaire (prévue le":"le"} ${frDate(e.visite)}${j<0?")":""}`})}
    const mo=new Date().getMonth();if(mo>=2&&mo<=4){const c=cpInfo(d,e);if(c&&c.solde>0)out.push({tab:"emp",niv:mo===4?"r":"o",txt:`${empNom(e)} : ${n2.format(c.solde).replace(",00","")} jour(s) de congés à prendre avant le 31 mai`})}
  }
  for(const b of bulsOf(d,k)){const p=bulsOf(d,kAdd(k,-1)).find(x=>x.emp===b.emp);if(p&&p.brut&&b.brut){const v=b.brut/p.brut-1;if(Math.abs(v)>=0.1)out.push({tab:"sal",niv:"o",txt:`Salaire de ${empNom(d.employes[b.emp])} : brut ${v>0?"+":"−"}${Math.abs(v*100).toFixed(0)} % par rapport à ${MOIS[+kAdd(k,-1).slice(5,7)-1].toLowerCase()}`})}}
  const nc=opsMois(d,k).filter(o=>!o.pole).length;if(nc)out.push({tab:"banque",niv:"o",txt:`${nc} opération(s) bancaire(s) de ${MOIS[S.month].toLowerCase()} non classée(s)`,act:"nonclassees"});
  const nv=nouvelles(d,k);if(nv.length)out.push({tab:"ana",niv:"o",txt:`${nv.length} nouvelle(s) dépense(s) apparue(s) en ${MOIS[S.month].toLowerCase()}`});
  const db=doublons(d,k);if(db.length)out.push({tab:"ana",niv:"r",txt:`${db.length} prélèvement(s) peut-être en double en ${MOIS[S.month].toLowerCase()}`});
  const ab=abonnements(d,k).filter(a=>a.hausse&&a.date.slice(0,7)===k);if(ab.length)out.push({tab:"ana",niv:"o",txt:`${ab.length} prélèvement(s) régulier(s) en hausse : ${ab.slice(0,3).map(a=>a.t).join(", ")}`});
  return out}

function schedule(){const a=document.activeElement;if(a&&a.closest&&a.closest("#app,#modalRoot")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="file"&&a.type!=="checkbox"){pending=true;return}render()}
document.addEventListener("focusout",()=>{if(pending){pending=null;setTimeout(()=>{const a=document.activeElement;if(a&&a.closest&&a.closest("#app,#modalRoot")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))pending=true;else render()},0)}});

function periode(extra){return `<div class="periode"><button class="nav" data-per="-1" aria-label="Mois précédent">‹</button><select id="perMois" aria-label="Mois">${MOIS.map((n,i)=>`<option value="${i}" ${i===S.month?"selected":""}>${n}</option>`).join("")}</select><input id="perAn" type="number" inputmode="numeric" min="2000" max="2100" value="${S.year}" aria-label="Année"><button class="nav" data-per="1" aria-label="Mois suivant">›</button>${extra||""}</div>`}
function bars(labels,series,fmt,h){h=h||170;const W=Math.max(560,labels.length*58),pad=34,n=labels.length,max=Math.max(1,...series.flatMap(s=>s.v.map(x=>Math.abs(x||0))));
  const bw=(W-pad*2)/n,sw=Math.min(22,(bw-10)/series.length);
  let g="";labels.forEach((l,i)=>{series.forEach((s,j)=>{const v=s.v[i]||0,bh=Math.abs(v)/max*(h-40),x=pad+i*bw+(bw-sw*series.length)/2+j*sw;
      g+=`<rect x="${x.toFixed(1)}" y="${(h-22-bh).toFixed(1)}" width="${(sw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${s.c}"><title>${esc(l+" · "+s.n+" : "+fmt(v))}</title></rect>`});
    g+=`<text x="${(pad+i*bw+bw/2).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(l)}</text>`});
  const leg=series.length>1?`<div class="leg">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join("")}</div>`:"";
  return `${leg}<div class="scroll"><svg viewBox="0 0 ${W} ${h}" width="100%" style="min-width:${Math.min(W,700)}px;max-height:${h+10}px" role="img">${g}<line x1="${pad}" x2="${W-pad}" y1="${h-22}" y2="${h-22}" stroke="var(--line)"/></svg></div>`}
const C1="var(--green-2)",C2="var(--red-2)",C3="#8a99a6";

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  $("#storeName").textContent=storeNom();updHist();
  if(S.locked){$("#app").innerHTML="";renderModal();return}
  renderModal();
  const a=document.activeElement,aid=a&&a.id;
  $("#app").innerHTML=({bord:vBord,emp:vEmp,sal:vSal,banque:vBanque,ana:vAna}[S.tab]||vBord)();
  if(aid){const el=document.getElementById(aid);if(el&&el.tagName!=="BUTTON"&&!el.closest("#modalRoot"))el.focus()}
}

function vBord(){const d=D(),k=curK(),kp=kAdd(k,-1),M=masse(d,k),Mp=masse(d,kp),ca=d.ca[k],eff=emps(d).filter(empActif).length;

  const opsP=opsMois(d,kp).filter(o=>!isInterne(o)),depP=-sum(opsP.filter(o=>o.montant<0),o=>o.montant);
  const sf=soldeFin(d,k),al=alertes(),nv=nouvelles(d,k).slice(0,8);
  const pp=parPole(d,k),ppp=parPole(d,kp);
  const top=polesTri(d).filter(p=>p.id!=="recet"&&p.id!=="virint").map(p=>({p,v:-(pp[p.id]||0),vp:-(ppp[p.id]||0)})).filter(x=>x.v>0||x.vp>0).sort((a,b)=>b.v-a.v).slice(0,8);
  return `${periode()}
  <div class="grid kpis">
    <div class="kpi hl"><span class="lbl">Masse salariale (coût employeur)</span><span class="v">${M.n?e0(M.cout):"—"}</span><span class="d">${M.n?M.n+" bulletin"+(M.n>1?"s":"")+" · "+evoHtml(evo(M.cout,Mp.cout),true)+" vs "+MC[+kp.slice(5,7)-1]:"aucun bulletin pour ce mois"}</span></div>
    <div class="kpi"><span class="lbl">Masse salariale / CA</span><span class="v">${M.n&&ca?pct(M.cout/ca):"—"}</span><span class="d">${ca?"CA HT "+e0(ca):"CA du mois à saisir dans SALAIRES"}</span></div>
    <div class="kpi"><span class="lbl">Effectif</span><span class="v">${eff}</span><span class="d">salarié${eff>1?"s":""} en poste</span></div>
    <div class="kpi"><span class="lbl">Dépenses du mois</span><span class="v">${ops.length?e0(dep):"—"}</span><span class="d">${ops.length?evoHtml(evo(dep,depP),true)+" vs "+MC[+kp.slice(5,7)-1]+" · recettes "+e0(rec):"aucun relevé pour ce mois"}</span></div>
    <div class="kpi ${sf&&sf.v<0?"alert":""}"><span class="lbl">Solde bancaire</span><span class="v">${sf?e0(sf.v):"—"}</span><span class="d">${sf?"au "+frDate(sf.au):"importez un relevé"}</span></div>
  </div>
  <div class="grid two" style="margin-top:16px">
    <div class="panel"><div class="band">À surveiller</div>${al.length?`<ul class="alist">${al.map(x=>`<li class="${x.niv}"><button class="alink" data-go="${x.tab}" ${x.act?`data-gofilt="${x.act}"`:""}>${esc(x.txt)}</button></li>`).join("")}</ul>`:`<div class="empty-state small">Rien à signaler pour ${MOIS[S.month].toLowerCase()} ${S.year}.</div>`}</div>
    <div class="panel"><div class="band">Nouvelles dépenses du mois</div>${nv.length?`<div class="scroll"><table><thead><tr><th class="l">Date</th><th class="l">Libellé</th><th>Montant</th></tr></thead><tbody>${nv.map(o=>`<tr><td class="l">${frD(o.date)}</td><td class="l lib">${esc(o.lib)}</td><td>${e2(-o.montant)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty-state small">Aucune dépense nouvelle repérée (il faut au moins deux mois de relevés).</div>`}</div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="band">Dépenses par pôle — ${MOIS[S.month]} ${S.year}</div>${top.length?`<div class="scroll"><table><thead><tr><th class="l">Pôle</th><th>${MC[+kp.slice(5,7)-1]}</th><th>${MC[S.month]}</th><th>Évolution</th></tr></thead><tbody>${top.map(x=>`<tr><td class="l">${esc(x.p.nom)}</td><td>${e0(x.vp)}</td><td><b>${e0(x.v)}</b></td><td>${evoHtml(evo(x.v,x.vp),true)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty-state small">Importez des relevés dans l'onglet BANQUE pour voir les dépenses par pôle.</div>`}</div>`}

function vAna(){const d=D(),k=curK(),k1=kAdd(k,-1),k2=kAdd(k,-2),pp=[parPole(d,k2),parPole(d,k1),parPole(d,k)];

  const other=MAGS.find(m=>m.id!==S.store),od=STORE[other.id],po=parPole(od,k),pm=pp[2];

  return `${periode()}

    <div class="panel"><div class="band">Nouvelles dépenses (jamais vues avant)</div>${nv.length?`<table><tbody>${nv.map(o=>`<tr><td class="l">${frD(o.date)}</td><td class="l lib">${esc(o.lib)}</td><td class="l small">${esc(poleNom(d,o.pole))}</td><td><b>${e2(-o.montant)}</b></td></tr>`).join("")}</tbody></table>`:`<div class="empty-state small">Aucune.</div>`}</div>

/* ================= lecture des PDF et CSV ================= */
let PDFLIB=null;
async function pdfLib(){if(PDFLIB)return PDFLIB;let lib;
  if(PC&&window.api.pdfjs){const src=await window.api.pdfjs();const u=x=>URL.createObjectURL(new Blob([x],{type:"text/javascript"}));lib=await import(u(src.lib));lib.GlobalWorkerOptions.workerSrc=u(src.worker)}
  else{const base=new URL("pc/pdfjs/",location.href).href;lib=await import(base+"pdf.min.mjs");lib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.mjs"}
  return PDFLIB=lib}
async function pdfPages(buf){const lib=await pdfLib();const task=lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,verbosity:0});const doc=await task.promise,pages=[];
  try{for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i),tc=await pg.getTextContent();pages.push(tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str.trim(),x:it.transform[4],y:it.transform[5],w:it.width})))}}
  finally{try{await task.destroy()}catch(_){}}return pages}
function lignes(items){const L=[];for(const it of items.slice().sort((a,b)=>b.y-a.y||a.x-b.x)){let l=L.find(l=>Math.abs(l.y-it.y)<2.5);if(!l){l={y:it.y,t:[]};L.push(l)}l.t.push(it)}
  L.sort((a,b)=>b.y-a.y);for(const l of L){l.t.sort((a,b)=>a.x-b.x);
    // pdf.js coupe parfois un nombre en morceaux (« 1 » « 234,56 ») : on les recolle
    const t=[];for(const it of l.t){const p=t[t.length-1];if(p&&/^\d{1,3}$/.test(p.s)&&/^\d{3}([ .]\d{3})*,\d{2}$/.test(it.s)&&it.x-(p.x+p.w)<6){p.s+=" "+it.s;p.w=it.x+it.w-p.x}else t.push({...it})}
    l.t=t;l.text=t.map(x=>x.s).join(" ")}return L}
const RE_AMT=/^[-+]?\d{1,3}(?:[ .  ]?\d{3})*,\d{2}[-]?$/;
const amt=s=>{const neg=/^-|-$/.test(s);const v=parseFloat(String(s).replace(/[-+ .  ]/g,"").replace(",","."));return neg?-v:v};
const RE_DATE=/^(\d{2})[\/.](\d{2})(?:[\/.](\d{2,4}))?$/;
const y4=y=>y.length===2?"20"+y:y;

function parseReleve(pages,fichier){
  const all=pages.flatMap((p,pi)=>lignes(p).map(l=>({...l,page:pi})));const text=all.map(l=>l.text).join("\n");
  const r={fichier,ops:[],debut:null,fin:null,soldeDebut:null,soldeFin:null};
  let m=/du\s+(\d{2})[\/.](\d{2})[\/.](\d{2,4})\s+au\s+(\d{2})[\/.](\d{2})[\/.](\d{2,4})/i.exec(text);
  if(m){r.debut=y4(m[3])+"-"+m[2]+"-"+m[1];r.fin=y4(m[6])+"-"+m[5]+"-"+m[4]}
  const finY=r.fin?+r.fin.slice(0,4):new Date().getFullYear(),finM=r.fin?+r.fin.slice(5,7):12;
  const isoOf=(dd,mm,yy)=>{let y=yy?+y4(yy):(+mm>finM?finY-1:finY);return y+"-"+mm+"-"+dd};
  let cols=null,cur=null,n=0;const soldes=[];
  for(const l of all){
    const hd=l.t.find(t=>/^d[ée]bit/i.test(t.s)),hc=l.t.find(t=>/^cr[ée]dit/i.test(t.s));
    if(hd&&hc){cols={d:hd.x+hd.w/2,c:hc.x+hc.w/2,page:l.page};cur=null;continue}
    const am=l.t.filter(t=>RE_AMT.test(t.s));
    const side=t=>{if(/^-|-$/.test(t.s))return -1;if(/^\+/.test(t.s))return 1;if(cols){const cx=t.x+t.w/2;return Math.abs(cx-cols.d)<=Math.abs(cx-cols.c)?-1:1}return -1};
    if(/\bsolde\b/i.test(l.text)&&am.length){const a=am[am.length-1];let v=Math.abs(amt(a.s));if(/d[ée]biteur/i.test(l.text)||(!/cr[ée]diteur/i.test(l.text)&&side(a)<0&&cols))v=-v;
      const dm=/(\d{2})[\/.](\d{2})[\/.](\d{2,4})/.exec(l.text);soldes.push({v,date:dm?y4(dm[3])+"-"+dm[2]+"-"+dm[1]:null});cur=null;continue}
    if(/total\s+des\s+(mouvements|op[ée]rations)|^report|^à reporter|^a reporter/i.test(l.text)){cur=null;continue}
    const d0=l.t[0]&&RE_DATE.exec(l.t[0].s);
    if(d0&&am.length){const a=am[am.length-1];
      const libT=l.t.slice(1).filter(t=>!am.includes(t)&&!(RE_DATE.test(t.s)&&t!==l.t[0]));
      cur={date:isoOf(d0[1],d0[2],d0[3]),lib:libT.map(t=>t.s).join(" ").replace(/\s+/g," ").trim(),montant:Math.round(Math.abs(amt(a.s))*side(a)*100)/100,n:n++,page:l.page,y:l.y};r.ops.push(cur);continue}
    if(cur&&!am.length&&!d0&&l.page===cur.page&&cur.y-l.y<16&&(cur.ext||0)<2&&!/^(date|page|banque populaire|relev[ée])/i.test(l.text)){cur.lib+=" "+l.text;cur.ext=(cur.ext||0)+1;cur.y=l.y;continue}
    cur=null}
  r.ops.forEach(o=>{delete o.page;delete o.y;delete o.ext;o.lib=o.lib.slice(0,160)});
  if(soldes.length){r.soldeDebut=soldes[0].v;if(soldes.length>1)r.soldeFin=soldes[soldes.length-1].v;
    if(!r.debut&&soldes[0].date)r.debut=soldes[0].date;if(!r.fin&&soldes.length>1&&soldes[soldes.length-1].date)r.fin=soldes[soldes.length-1].date}
  if(!r.debut&&r.ops.length)r.debut=r.ops.map(o=>o.date).sort()[0];if(!r.fin&&r.ops.length)r.fin=r.ops.map(o=>o.date).sort().pop();
  controle(r);return r}
function controle(r){if(r.soldeDebut!=null&&r.soldeFin!=null){const calc=Math.round((r.soldeDebut+sum(r.ops,o=>o.montant))*100)/100;r.ecart=Math.round((r.soldeFin-calc)*100)/100;r.controle=Math.abs(r.ecart)<0.01?"ok":"ecart"}}
function parseCsv(txt,fichier){const lines=txt.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return{fichier,ops:[],err:"fichier vide"};
  const sep=[";","\t",","].map(s=>[s,lines[0].split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const split=l=>{const out=[];let cur="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===sep&&!q){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out.map(x=>x.trim())};
  let hi=lines.findIndex(l=>/date/i.test(l)&&/(libell|montant|d[ée]bit|label)/i.test(l));if(hi<0)return{fichier,ops:[],err:"colonnes non reconnues (Date, Libellé, Montant ou Débit/Crédit)"};
  const H=split(lines[hi]).map(h=>nk(h)),ix=re=>H.findIndex(h=>re.test(h));
  const iD=ix(/^DATE( OPERATION| COMPTA| DE COMPTABILISATION)?$/)>=0?ix(/^DATE( OPERATION| COMPTA| DE COMPTABILISATION)?$/):ix(/DATE/),iL=ix(/LIBELLE|LABEL|DESCRIPTION/),iM=ix(/^MONTANT/),iDe=ix(/DEBIT/),iCr=ix(/CREDIT/);
  const num=s=>{s=String(s||"").replace(/[\s €]/g,"");if(!s)return 0;if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)||0};
  const ops=[];let n=0;for(const l of lines.slice(hi+1)){const c=split(l);const dm=/^(\d{2})[\/.-](\d{2})[\/.-](\d{2,4})$/.exec(c[iD]||"")||null,di=/^(\d{4})-(\d{2})-(\d{2})/.exec(c[iD]||"");
    const date=dm?y4(dm[3])+"-"+dm[2]+"-"+dm[1]:di?di[1]+"-"+di[2]+"-"+di[3]:null;if(!date)continue;
    let m=iM>=0?num(c[iM]):num(c[iCr])-Math.abs(num(c[iDe]));if(!m)continue;
    ops.push({date,lib:(c[iL]||"").replace(/\s+/g," ").slice(0,160),montant:Math.round(m*100)/100,n:n++})}
  const ds=ops.map(o=>o.date).sort();return{fichier,ops,debut:ds[0]||null,fin:ds[ds.length-1]||null,soldeDebut:null,soldeFin:null}}

function parseBulletin(items,dd){const L=lignes(items),T=L.map(l=>l.text).join("\n");
  const nums=l=>l.t.filter(t=>/^-?\d{1,3}(?:[ .  ]?\d{3})*,\d{2,4}$/.test(t.s)).map(t=>amt(t.s.replace(/,(\d{2})\d+$/,",$1")));
  const line=re=>L.find(l=>re.test(l.text)&&nums(l).length);
  const last=re=>{const l=line(re);if(!l)return null;const v=nums(l);return v[v.length-1]};
  const r={};
  r.brut=last(/salaire\s+brut|total\s+brut|^brut\b|\bbrut\s+(soumis|total)/i);
  r.net=last(/net\s+[àa]\s+payer(?!\s+avant)|net\s+pay[ée]/i);if(r.net==null)r.net=last(/net\s+[àa]\s+payer/i);
  const tc=line(/total\s+(des\s+)?(cotisations|retenues|charges)/i);if(tc){const v=nums(tc);if(v.length>=2){r.chargesSal=v[0];r.chargesPat=v[v.length-1]}else r.chargesSal=v[0]}
  r.cout=last(/co[uû]t\s+(global|total)|total\s+(co[uû]t\s+)?employeur|co[uû]t\s+employeur/i);
  if(r.chargesPat==null){const p=last(/(total\s+)?(charges|cotisations)\s+patronales/i);if(p!=null)r.chargesPat=p}
  if(r.chargesPat==null&&r.cout!=null&&r.brut!=null)r.chargesPat=Math.round((r.cout-r.brut)*100)/100;
  const base=line(/salaire\s+de\s+base|appointements|salaire\s+mensuel/i);if(base){const v=nums(base);if(v.length>=2&&v[0]<=260)r.heures=v[0]}
  const hs=L.filter(l=>/heures?\s+sup|h\.?\s*sup\b|heures?\s+compl|majoration/i.test(l.text)&&nums(l).length).map(l=>{const v=nums(l);return v[v.length-1]});if(hs.length)r.hsup=Math.round(sum(hs)*100)/100;
  const pr=L.filter(l=>/prime|gratification|13\s*[èe]me|treizi[èe]me|bonus/i.test(l.text)&&!/total/i.test(l.text)&&nums(l).length).map(l=>{const v=nums(l);return v[v.length-1]});if(pr.length)r.primes=Math.round(sum(pr)*100)/100;
  const cp=line(/(solde|reste).{0,20}(cp|cong)|(cp|cong[ée]s).{0,30}(solde|reste)/i);if(cp){const v=nums(cp);r.cpSolde=v[v.length-1]}
  let m=/p[ée]riode\s+du\s+\d{2}[\/.](\d{2})[\/.](\d{2,4})/i.exec(T)||/(?:paie|p[ée]riode|mois)\s*:?\s*(\d{2})[\/.](\d{4})/i.exec(T);
  if(m)r.mois=y4(m[2])+"-"+m[1];else{const mm=new RegExp("("+MOIS.map(x=>nk(x)).join("|")+")\\s+(20\\d{2})").exec(nk(T));if(mm)r.mois=mm[2]+"-"+String(MOIS.map(x=>nk(x)).indexOf(mm[1])+1).padStart(2,"0")}
  const RN=/^(m\.|mr\.?|mme|mlle|monsieur|madame)\s+(?=[a-zà-ÿ])/i;
  for(const l of L){const i=l.t.findIndex(t=>RN.test(t.s)||(/^(m\.|mr\.?|mme|mlle|monsieur|madame)$/i.test(t.s)));if(i<0)continue;
    let n=RN.test(l.t[i].s)?l.t[i].s.replace(RN,""):"";for(let j=i+1;j<l.t.length&&n.split(" ").length<3&&l.t[j].x-(l.t[j-1].x+l.t[j-1].w)<12;j++)n+=" "+l.t[j].s;
    r.nomLu=n.replace(/\s+/g," ").trim().slice(0,60);if(r.nomLu)break}
  const NT=" "+nk(T)+" ";const E=emps(dd).filter(e=>e.nom&&NT.includes(" "+nk(e.nom)+" "));
  if(E.length){const best=E.find(e=>e.prenom&&NT.includes(" "+nk(e.prenom)+" "))||E[0];r.emp=best.id}
  r.trouve=["brut","net"].every(k=>r[k]!=null);return r}

async function lireFichiers(files,kind){const out=[];
  for(const f of files){const buf=await f.arrayBuffer();
    try{if(kind==="rel"){if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){const P=await pdfPages(buf);const r=parseReleve(P,f.name);if(!r.ops.length)r.err="aucune opération trouvée";out.push(r)}
        else{let t=new TextDecoder("utf-8").decode(buf);if(t.includes("\ufffd"))t=new TextDecoder("windows-1252").decode(buf);out.push(parseCsv(t,f.name))}}
      else{const P=await pdfPages(buf);P.forEach((items,i)=>{const r=parseBulletin(items);if(r.brut==null&&r.net==null)return;out.push({...r,fichier:f.name,page:i+1,pages:P.length,ok:true})})}}
    catch(e){console.error(e);out.push(kind==="rel"?{fichier:f.name,ops:[],err:"lecture impossible"}:{fichier:f.name,page:1,pages:1,ok:false,nomLu:"(PDF illisible)"})}}
  return out}
async function importRel(files){S.relImport={busy:files.length+" fichier(s)",files:[]};render();
  const R=await lireFichiers(files,"rel"),d=D(),seen=new Set(opsAll(d).map(o=>o.date+"|"+o.montant+"|"+nk(o.lib)));
  for(const r of R)for(const o of r.ops){const key=o.date+"|"+o.montant+"|"+nk(o.lib);o.doublon=seen.has(key);seen.add(key);o.pole=classer(d,o.lib)}
  S.relImport={files:R};render()}
function saveRel(){const I=S.relImport;if(!I)return;let n=0,nc=0;
  change(d=>{for(const f of I.files){const ops=f.ops.filter(o=>!o.doublon);if(!ops.length&&!f.soldeFin)continue;const rid=uid();
    d.releves[rid]={fichier:f.fichier,debut:f.debut,fin:f.fin,soldeDebut:f.soldeDebut,soldeFin:f.soldeFin,controle:f.controle||null,ecart:f.ecart??null,n:ops.length,importeLe:todayISO()};
    for(const o of ops){d.ops[uid()]={date:o.date,lib:o.lib,montant:o.montant,pole:o.pole||"",tiers:tiers(o.lib),releve:rid,n:o.n};n++;if(!o.pole)nc++}}});
  const last=I.files.map(f=>f.fin).filter(Boolean).sort().pop();if(last){S.year=+last.slice(0,4);S.month=+last.slice(5,7)-1}
  S.relImport=null;S.opFilt=nc?"nonclassees":"tout";toast(n+" opération(s) enregistrée(s)"+(nc?", "+nc+" à classer":""));render()}
async function importBul(files){S.bulImport={busy:files.length+" fichier(s)",rows:[]};render();
  const rows=await lireFichiers(files,"bul");if(!rows.length){S.bulImport=null;toast("Aucun bulletin reconnu dans ce(s) PDF : saisissez-le à la main.");render();return}
  rows.forEach(r=>{if(!r.mois)r.mois=curK();if(!r.emp&&r.nomLu&&r.nomLu!=="(PDF illisible)"){r.emp="+new"}});S.bulImport={rows};render()}
function saveBul(){const I=S.bulImport;if(!I)return;const R=I.rows.filter(r=>r.ok);
  if(R.some(r=>!r.emp||!r.mois)){toast("Choisissez le salarié et le mois de chaque ligne cochée.");return}let n=0;const crees={};
  change(d=>{for(const r of R){let emp=r.emp;
      if(emp==="+new"){const key=nk(r.nomLu);emp=crees[key];if(!emp){const w=(r.nomLu||"").split(" ");emp=crees[key]=uid();d.employes[emp]={nom:(w[0]||"").toUpperCase(),prenom:w.slice(1).join(" "),contrat:"CDI",actif:true}}}
      const old=Object.entries(d.bulletins).find(([,b])=>b.emp===emp&&b.mois===r.mois);const id=old?old[0]:uid();
      const b={emp,mois:r.mois,source:r.fichier};BUL_F.forEach(([k])=>{if(r[k]!=null&&r[k]!=="")b[k]=r[k]});d.bulletins[id]=b;n++}});
  const k=R[0].mois;S.year=+k.slice(0,4);S.month=+k.slice(5,7)-1;S.bulImport=null;toast(n+" bulletin(s) enregistré(s)");render()}

/* ================= v3-v4 : lecture automatique de dossiers (PC pilote) =================
   Réglés sur chaque PC / session Windows (Réglages > Ce PC) : « releves » (relevés bancaires) et « bulletins » (bulletins de paie).
   Le PC pilote (portable de la comptable : démarrage avec Windows + connexion automatique) lit ces dossiers au démarrage puis
   toutes les 15 min, même verrouillé ou en petite icône, et la synchronisation partage tout avec les autres postes.
   Chaque fichier n'est lu qu'une fois ; ce qui est déjà dans GESCOUNT est ignoré. */
const DOS={releves:{nom:"relevés bancaires",ic:"🏦",busy:false,msg:"",last:null},bulletins:{nom:"bulletins de paie",ic:"📄",busy:false,msg:"",last:null}};
const dosReg=k=>(S.poste&&S.poste[k])||null;
function dosVus(k){try{return JSON.parse(rawLoad("gescount-"+k+"-vus")||"{}")||{}}catch(e){return{}}}
function dosJournal(){try{return JSON.parse(rawLoad("gescount-dossiers-journal")||"[]")||[]}catch(e){return[]}}
function enregistrerReleve(f,magId){const d=STORE[magId],seen=new Set(opsAll(d).map(o=>o.date+"|"+o.montant+"|"+nk(o.lib)));
  const ops=f.ops.filter(o=>{const k=o.date+"|"+o.montant+"|"+nk(o.lib);if(seen.has(k))return false;seen.add(k);return true});
  const deja=Object.values(d.releves).some(x=>x.fichier===f.fichier&&x.debut===f.debut&&x.fin===f.fin);
  if(!ops.length&&deja)return 0;
  change(x=>{const rid=uid();x.releves[rid]={fichier:f.fichier,debut:f.debut,fin:f.fin,soldeDebut:f.soldeDebut,soldeFin:f.soldeFin,controle:f.controle||null,ecart:f.ecart??null,n:ops.length,importeLe:todayISO(),auto:true};
    for(const o of ops)x.ops[uid()]={date:o.date,lib:o.lib,montant:o.montant,pole:classer(x,o.lib),tiers:tiers(o.lib),releve:rid,n:o.n}},magId);

// Bulletins : salarié reconnu par son nom (sinon créé), mois lu sur la page ; un bulletin déjà présent (même salarié, même mois) n'est pas remplacé.

async function dosAuto(k){if(!PC||!window.api.dossierLister||!AUTH.key)return;const D0=DOS[k];if(D0.busy)return;

    case "addPole":{const v=$("#newPole").value.trim();if(!v)return;const id="p"+uid();change(x=>{x.poles[id]={nom:v,ordre:Object.keys(x.poles).length}});break}
    case "addRegle":{const m=nk($("#newMotif").value),p=$("#newMotifPole").value;if(!m||!p)return;change(x=>{x.regles[uid()]={motif:m,pole:p};for(const o of Object.values(x.ops))if(!o.pole)o.pole=classer(x,o.lib)});toast("Règle ajoutée");break}
    case "reclasser":{let n=0;change(x=>{for(const o of Object.values(x.ops))if(!o.pole){o.pole=classer(x,o.lib);if(o.pole)n++}});toast(n+" opération(s) classée(s)");break}
  }
});
document.addEventListener("change",e=>{const t=e.target,ds=t.dataset;
  if(t.id==="perMois"){S.month=+t.value;render();return}
  if(t.id==="perAn"){const y=+t.value;if(y>1999&&y<2101){S.year=y;render()}return}
  if(t.id==="importFile"){const f=t.files[0];if(f){const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(f)}t.value="";return}
  if(t.id==="relFile"){const f=[...t.files];t.value="";if(f.length)importRel(f);return}
  if(t.id==="bulFile"){const f=[...t.files];t.value="";if(f.length)importBul(f);return}
  if(t.id==="opPole"){S.opPole=t.value;render();return}
  if(ds.dosdepuis){const k=ds.dosdepuis;window.api.dossierSet(k,{depuis:t.value||""}).then(async()=>{S.poste=await window.api.posteGet();toast(t.value?DOS[k].nom+" importés à partir de "+kLbl(t.value).toLowerCase():"Tous les fichiers seront importés")});return}
  if(ds.ca){const v=parseNum(t.value);if(Number.isNaN(v)){toast("Montant non reconnu");return}change(x=>{if(v==null)delete x.ca[ds.ca];else x.ca[ds.ca]=v});return}
  if(ds.polenom){const id=ds.polenom,v=t.value.trim();if(v)change(x=>{x.poles[id].nom=v});return}
  if(ds.oppole){const id=ds.oppole,p=t.value,d=D(),o=d.ops[id],tr=o.tiers||tiers(o.lib);let n=0;
    change(x=>{x.ops[id].pole=p;if(!p||!tr)return;
      const ex=Object.entries(x.regles).find(([,r])=>nk(r.motif)===tr);if(ex)ex[1].pole=p;else x.regles[uid()]={motif:tr,pole:p};
      for(const[k,op]of Object.entries(x.ops))if(k!==id&&!op.pole&&(op.tiers||tiers(op.lib))===tr){op.pole=p;n++}});
    toast(`Règle apprise : « ${tr} » → ${poleNom(D(),p)}`+(n?` (${n} autre(s) opération(s) classée(s))`:""));return}
  if(ds.bi!=null){const r=S.bulImport.rows[+ds.bi],k=ds.bk;if(k==="ok")r.ok=t.checked;else if(k==="emp"||k==="mois")r[k]=t.value;else{const v=parseNum(t.value);r[k]=Number.isNaN(v)?null:v}
    if(k==="ok"){const b=document.querySelector('[data-act="bulSave"]');if(b)b.textContent="Enregistrer "+S.bulImport.rows.filter(r=>r.ok).length+" bulletin(s)";t.closest("tr").classList.toggle("dim",!t.checked)}return}
});
document.addEventListener("input",e=>{if(e.target.id==="opText"){S.opText=e.target.value;clearTimeout(S.opT);S.opT=setTimeout(()=>{const p=e.target.selectionStart;render();const el=$("#opText");if(el){el.focus();try{el.setSelectionRange(p,p)}catch(_){}}},250)}});
document.addEventListener("submit",e=>{const f=e.target;if(!f.closest("#app"))return;e.preventDefault();
  if(f.id==="empForm"){const v=readForm("em-",["nom","prenom","poste","contrat","entree","finContrat","finEssai","visite","heures","taux","sortie","notes"]);if(!v.nom){toast("Le nom est obligatoire");return}
    const o={...v,nom:v.nom.toUpperCase(),heures:parseNum(v.heures),taux:parseNum(v.taux),actif:true};for(const k of Object.keys(o))if(o[k]===""||o[k]==null||Number.isNaN(o[k]))delete o[k];
    const id=S.editEmp.id||uid();change(x=>{const old=x.employes[id]||{};const keep={};["cpSolde","cpAu"].forEach(k=>{if(old[k]!=null)keep[k]=old[k]});x.employes[id]={...keep,...o}});S.editEmp=null;toast("Salarié enregistré");return}
  if(f.id==="bulForm"){const emp=$("#bu-emp").value,mois=$("#bu-mois").value;if(!emp||!mois){toast("Choisissez le salarié et le mois");return}
    const b={emp,mois};for(const[k]of BUL_F){const v=parseNum($("#bu-"+k).value);if(Number.isNaN(v)){toast("Valeur non reconnue : "+k);return}if(v!=null)b[k]=v}
    const id=S.editBul.id||(Object.entries(D().bulletins).find(([,x])=>x.emp===emp&&x.mois===mois)||[uid()])[0];change(x=>{x.bulletins[id]={...(x.bulletins[id]&&x.bulletins[id].source?{source:x.bulletins[id].source}:{}),...b}});S.editBul=null;toast("Bulletin enregistré");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();if(S.modal){S.modal=false;render()}}
  if(!(e.ctrlKey||e.metaKey)||S.locked)return;const k=e.key.toLowerCase();if(k==="l"){e.preventDefault();lock();return}
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if(k==="z"&&!e.shiftKey){e.preventDefault();undo()}else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();redo()}});

/* ---------- magasins ---------- */
function closeMenu(){$("#storeMenu").hidden=true}
function toggleStoreMenu(){const m=$("#storeMenu");if(!m.hidden){m.hidden=true;return}
  m.innerHTML=MAGS.map(g=>`<button role="menuitem" data-store="${g.id}" aria-current="${g.id===S.store}">⌂ ${esc(g.nom)}</button>`).join("");
  const r=$("#houseBtn").getBoundingClientRect();m.style.top=(r.bottom+window.scrollY+6)+"px";m.style.left=Math.max(8,Math.min(r.left+window.scrollX,window.innerWidth-220))+"px";m.hidden=false}
document.addEventListener("click",e=>{if(!e.target.closest("#storeMenu,#houseBtn"))closeMenu()},true);
function switchStore(id){if(id===S.store)return;S.store=id;S.editEmp=S.editBul=S.ficheEmp=S.bulImport=S.relImport=S.editConge=null;try{localStorage.setItem(LSP+"store",id)}catch(_){};render();toast("Magasin : "+storeNom())}

/* ================= démarrage ================= */
if(PC&&window.api.updateCheck){let last=0;const auto=()=>{if(Date.now()-last<60000||S.majBusy)return;last=Date.now();const was=majBadge();majCheck(true).then(()=>{if(majBadge()!==was)render()}).catch(()=>{})};
  setTimeout(auto,4000);setInterval(()=>{last=0;auto()},600000);window.addEventListener("focus",auto);document.addEventListener("visibilitychange",()=>{if(!document.hidden)auto()});
  // mise à jour automatique chaque soir à 21 h (comme GESTIME et GESMAR), jamais pendant une saisie
  const H=21;let fait=new Date().getHours()>=H?new Date().toDateString():"",soir=false;
  const soirGo=async()=>{const el=document.activeElement;if(S.majBusy||(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&!S.locked))return;if(new Date().getHours()<H){soir=false;return}
    S.majBusy=true;try{const r=await window.api.updateCheck(majUrl());soir=r.status==="error";
      if(r.status==="new"){await Promise.all(Object.values(SAVEQ));await new Promise(f=>setTimeout(f,2000));const x=await window.api.updateApply(majUrl());if(x.status==="done")return;soir=true}}catch(e){soir=true}
    S.majBusy=false};
  setInterval(()=>{const n=new Date(),dd=n.toDateString();if(n.getHours()>=H&&fait!==dd){fait=dd;soir=true}if(soir)soirGo()},60000)}
window.GESCOUNT={sync:SYNC,store:STORE,S,parseReleve,parseBulletin,parseCsv,lignes,render,tiers,classer}; // pour le diagnostic et les tests
showLock("");render();
if(PC&&window.api.posteGet)(async()=>{try{S.poste=await window.api.posteGet()}catch(e){S.poste=null}
  if(window.api.onLock)window.api.onLock(()=>{if(!S.locked)lock()});
  if(S.poste&&S.poste.connexionAuto){const c=await window.api.connexionAutoGet().catch(()=>null);
    if(!c){showLock("Connexion automatique impossible sur ce PC : tapez le mot de passe.");return}
    $("#lgMsg").textContent="Connexion automatique…";
    try{await login(c.email,c.pw);S.autoCo=true;showLock("")}
    catch(e){S.autoKo=true;showLock("Connexion automatique refusée ("+(e.message||e)+"). Tapez le mot de passe.")}}
})();
})();

</script>
